
name: Build GhesseKhane APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          test -n "$ZIP"
          unzip -o "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -print -quit)
          test -n "$PROJECT"
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhesseKhane-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          
